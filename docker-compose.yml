services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: everfit
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      DB_NAME: everfit
      DB_SYNCHRONIZE: "false"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  migrate:
    build:
      context: .
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: everfit
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      DB_NAME: everfit
      DB_SYNCHRONIZE: "false"
    command: ["node", "./node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everfit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      POSTGRES_DB: everfit
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everfit -d everfit"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - everfit_pg:/var/lib/postgresql/data
volumes:
  everfit_pg:
